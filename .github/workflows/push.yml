name: Test and Build
on: [push, pull_request]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - name: Run tests
        run: go test ./... -v
      - name: Run linter
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14.0
          skip-cache: true
      - name: Package Lambda
        run: make package-lambda
      - name: Verify package and inline trigger
        run: python3 -m unittest discover -s test/lambda -v
      - name: Save Lambda package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fog-lambda-al2023-${{ github.sha }}
          path: dist/lambda.zip
          if-no-files-found: error
